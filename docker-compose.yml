services:
  postgres:
    image: postgres:16-alpine
    container_name: rsm-assessments-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rsm_assessments}
      POSTGRES_USER: ${POSTGRES_USER:-rsm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rsm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
